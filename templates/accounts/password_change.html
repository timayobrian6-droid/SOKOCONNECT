{% extends "accounts/_auth_layout.html" %}
{% block title %}Change password — SokoConnect{% endblock %}
{% block auth_content %}
<h1>Change password</h1>
<form method="post" class="stack-form" novalidate>
  {% csrf_token %}
  {% for field in form %}{% include "store/_form_field.html" %}{% endfor %}
  <button class="btn-bz btn-block" type="submit">Update password</button>
</form>
<p class="auth-alt"><a href="{% url 'accounts:account' %}">← Back to my account</a></p>
{% endblock %}
